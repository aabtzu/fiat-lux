name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: webapp/requirements-dev.txt

      - run: pip install -r webapp/requirements-dev.txt

      - run: pytest webapp/tests -q
