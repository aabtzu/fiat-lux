name: tests

on:
  push:
    branches: [main]
  pull_request:
  # Lets a run be started by hand. Needed when a commit lands on a branch
  # before its PR exists: no synchronize event fires, so that head can sit
  # with no run against it and no way to ask for one.
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: webapp/requirements-dev.txt

      - run: pip install -r webapp/requirements-dev.txt

      - run: pytest webapp/tests -q
